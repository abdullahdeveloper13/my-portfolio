services:
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/abdullah_portfolio?schema=public
      SESSION_SECRET: change-this-in-production
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD_HASH: ""
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: abdullah_portfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [portfolio-db:/var/lib/postgresql/data]
volumes:
  portfolio-db:
